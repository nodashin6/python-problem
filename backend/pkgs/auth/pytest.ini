[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
addopts = 
    --tb=short
    --strict-markers
filterwarnings =
    ignore:Support for class-based.*:DeprecationWarning:pydantic.*
    ignore::pydantic._internal._config.PydanticDeprecatedSince20
