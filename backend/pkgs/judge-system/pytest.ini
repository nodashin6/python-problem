[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = 
    -v
    --tb=short
    --disable-warnings
    --color=yes
    --asyncio-mode=auto
markers =
    unit: Unit tests
    integration: Integration tests  
    slow: Slow running tests
    event_handler: Event handler tests
    api_usecase: API usecase tests
    message_queue: Message queue tests